<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Panel Administrativo — VictorH4K</title>
<meta name="robots" content="noindex, nofollow"/>
<link rel="icon" href="/favicon.ico"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── FONDO: imagen de estudio oscura ── */
.bg {
  min-height: 100vh;
  background-image: url('/images/studio/Panel.png');
  background-size: cover;
  background-position: center;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  position: relative;
}
/* Sin overlay — imagen limpia */

/* ── TARJETA GLASSMORPHISM ── */
.card {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
  background: rgba(10, 5, 5, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  padding: 48px 40px 36px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5), 0 0 0 1px rgba(213,43,53,0.15);
  display: flex; flex-direction: column; align-items: center; gap: 0;
  text-align: center;
}

/* ── LOGO ── */
.logo-area { margin-bottom: 24px; }

/* ── TÍTULOS ── */
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 24px; font-weight: 800; color: #fff;
  letter-spacing: -0.02em; margin-bottom: 6px;
}
.card-subtitle {
  font-size: 13px; color: rgba(255,255,255,0.45);
  margin-bottom: 32px; line-height: 1.5;
}

/* ── ERROR ── */
.login-error {
  width: 100%; display: none;
  align-items: flex-start; gap: 8px;
  padding: 11px 14px; border-radius: 10px;
  background: rgba(213,43,53,0.12);
  border: 1px solid rgba(213,43,53,0.3);
  color: #ff6b6b; font-size: 12px; line-height: 1.55;
  margin-bottom: 18px; text-align: left;
}
.login-error.show { display: flex; }

/* ── BOTÓN GOOGLE ── */
.btn-google {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 18px;
  background: rgba(255,255,255,0.97);
  color: #3c4043;
  border: none; border-radius: 10px;
  font-family: 'Inter', sans-serif;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  transition: all .18s;
  margin-bottom: 14px;
}
.btn-google:hover {
  background: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
  transform: translateY(-1px);
}
.btn-google:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
.btn-google-left {
  display: flex; align-items: center; gap: 10px;
}
.google-icon { width: 20px; height: 20px; flex-shrink: 0; }
.btn-google-arrow {
  font-size: 14px; color: #999;
  transition: transform .18s;
}
.btn-google:hover .btn-google-arrow { transform: translateX(3px); }

/* Spinner inline */
.spinner-sm {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2px solid rgba(60,64,67,0.2);
  border-top-color: #3c4043;
  animation: spin .7s linear infinite; flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── NOTA DE SEGURIDAD ── */
.security-note {
  width: 100%; display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 14px; border-radius: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 28px;
}
.security-note-icon {
  width: 28px; height: 28px; border-radius: 7px;
  background: rgba(213,43,53,0.15); border: 1px solid rgba(213,43,53,0.25);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 12px; color: #D52B35;
}
.security-note-text {
  font-size: 11.5px; color: rgba(255,255,255,0.45);
  line-height: 1.6; text-align: left;
}

/* ── FOOTER ── */
.card-footer {
  border-top: 1px solid rgba(255,255,255,0.07);
  padding-top: 20px; width: 100%;
}
.card-footer-brand {
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.3);
  letter-spacing: .18em; text-transform: uppercase;
}
.card-footer-sub {
  font-size: 10px; color: rgba(255,255,255,0.18);
  letter-spacing: .12em; text-transform: uppercase; margin-top: 3px;
}
.back-link {
  display: block; margin-top: 14px;
  font-size: 11px; color: rgba(255,255,255,0.2);
  text-decoration: none; transition: color .15s;
}
.back-link:hover { color: rgba(255,255,255,0.5); }

@media (max-width: 480px) {
  .card { padding: 36px 24px 28px; }
  .card-title { font-size: 21px; }
}
</style>
</head>
<body>

<div class="bg">
  <div class="card">

    <!-- Logo -->
    <div class="logo-area">
      <img src="/images/logo-victorh4k.png" alt="VictorH4K" style="width:200px;height:auto;margin:0 auto 16px;display:block;filter:drop-shadow(0 4px 16px rgba(213,43,53,0.35))"/>
    </div>

    <!-- Título -->
    <h1 class="card-title">Panel Administrativo</h1>
    <p class="card-subtitle">Acceso exclusivo para el administrador</p>

    <!-- Error -->
    <div class="login-error" id="login-error">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="login-error-msg">Acceso denegado.</span>
    </div>

    <!-- Botón Google -->
    <button class="btn-google" id="btn-google" onclick="loginWithGoogle()">
      <div class="btn-google-left">
        <!-- Logo G de Google en SVG -->
        <svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continuar con Google</span>
      </div>
      <span class="btn-google-arrow">›</span>
    </button>

    <!-- Nota de seguridad -->
    <div class="security-note">
      <div class="security-note-icon">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <p class="security-note-text">
        El acceso está restringido a una cuenta autorizada. Cualquier otra cuenta será rechazada automáticamente.
      </p>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <div class="card-footer-brand">VictorH4K Producer</div>
      <div class="card-footer-sub">Panel de administración</div>
      <a href="/" class="back-link">← Volver al sitio</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
<script src="/admin/js/admin-core.js"></script>
<script>
const ALLOWED_EMAIL = 'victorplaycontacto0007@gmail.com';

document.addEventListener('DOMContentLoaded', async () => {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const email = session.user.email?.toLowerCase().trim();
    if (email !== ALLOWED_EMAIL.toLowerCase()) {
      await sb.auth.signOut(); showError('La cuenta ' + email + ' no tiene acceso.'); return;
    }
    const { data: profile } = await sb.from('admin_profiles')
      .select('id').eq('user_id', session.user.id).eq('is_active', true).single();
    if (profile) { location.href = '/admin/dashboard.html'; return; }
  }
  const params = new URLSearchParams(location.search);
  if (params.get('error') === 'no_access') showError('La cuenta usada no tiene acceso al panel.');
});

function showError(msg) {
  document.getElementById('login-error-msg').textContent = msg;
  document.getElementById('login-error').classList.add('show');
}

async function loginWithGoogle() {
  const btn = document.getElementById('btn-google');
  btn.disabled = true;
  btn.innerHTML = `<div class="btn-google-left"><div class="spinner-sm"></div><span>Conectando...</span></div>`;

  if (!sb) { showError('Error de conexión.'); btn.disabled = false; return; }

  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: {
      redirectTo: window.location.origin + '/admin/callback.html',
      queryParams: { prompt: 'select_account' },
    },
  });

  if (error) {
    showError('Error al conectar con Google: ' + error.message);
    btn.disabled = false;
    btn.innerHTML = `<div class="btn-google-left"><svg class="google-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg><span>Continuar con Google</span></div><span class="btn-google-arrow">›</span>`;
  }
}
</script>
</body>
</html>
